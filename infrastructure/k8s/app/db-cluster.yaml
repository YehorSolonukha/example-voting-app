apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db-cluster
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: postgres
      owner: app
      postInitSQLRefs:
        configMapRefs:
          - name: db-init-scripts
            key: schema.sql

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: yehor542/gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
        env:
        - name: WAF_DB_HOST
          value: waf-db-cluster-rw
        - name: WAF_REDIS_HOST
          value: waf-redis-ha-master
        - name: WAF_DB_USER
          valueFrom:
            secretKeyRef:
              name: waf-db-cluster-app
              key: username
        - name: WAF_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waf-db-cluster-app
              key: password
        - name: VOTE_APP_URL
          value: http://vote

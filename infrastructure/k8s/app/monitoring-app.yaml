apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 61.3.2
      helm:
        valueFiles:
          - $mygithub/infrastructure/k8s/monitoring/values.yaml
    - repoURL: https://github.com/YehorSolonukha/example-voting-app.git
      targetRevision: main
      ref: mygithub
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
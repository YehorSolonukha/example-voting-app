apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 19.5.4
    helm:
      values: |
        fullnameOverride: "redis-ha"
        architecture: replication
        image:
          tag: "latest"
        auth:
          enabled: false
        master:
          persistence:
            size: 1Gi
        replica:
          replicaCount: 2
          persistence:
            size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
